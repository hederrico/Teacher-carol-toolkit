<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerador de Caça-Palavras - Teacher Carol's Toolkit">
    <meta name="author" content="Caroline Castro">
    
    <title>Gerador de Caça-Palavras | Teacher Carol's Toolkit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Dependências CSS -->
    <link href="../../libs/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="styles.css">
    
    <link rel="icon" type="image/png" href="../../images/logo.png">
</head>
<body>
    
    <header class="header">
        <div class="header-content">
            <a href="../../index.html" class="logo-container">
                <img src="../../images/logo.png" alt="Teacher Carol's Toolkit Logo" class="logo-img">
                <div class="site-title">
                    <h1>Teacher Carol's Toolkit</h1>
                    <span class="site-subtitle">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="3" y1="7.5" x2="21" y2="7.5"/>
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="16.5" x2="21" y2="16.5"/>
                            <line x1="7.5" y1="3" x2="7.5" y2="21"/>
                            <line x1="12" y1="3" x2="12" y2="21"/>
                            <line x1="16.5" y1="3" x2="16.5" y2="21"/>
                            <line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                            <circle cx="5.25" cy="18.75" r="1.5" fill="currentColor" opacity="0.8"/>
                            <circle cx="9.75" cy="14.25" r="1.5" fill="currentColor" opacity="0.8"/>
                            <circle cx="14.25" cy="9.75" r="1.5" fill="currentColor" opacity="0.8"/>
                            <circle cx="18.75" cy="5.25" r="1.5" fill="currentColor" opacity="0.8"/>
                        </svg>
                        Gerador de Caça-Palavras
                    </span>
                </div>
            </a>
            <div class="keyboard-shortcut-hint">
                Atalho: <kbd>Shift</kbd> + <kbd>Enter</kbd>
            </div>
        </div>
    </header>

    <main style="flex: 1; padding: var(--spacing-md) 0;">
        <div class="container">
            <div class="config-panel" id="configPanel">
                <div class="config-header">
                    <h1 class="page-title">Gerador de Caça-Palavras</h1>
                    <button class="toggle-config-btn" id="toggleConfigBtn" style="display: none;">
                        <span></span>
                        <span>Recolher</span>
                    </button>
                </div>

                <div class="config-content">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="gridSize">Tamanho da Grade</label>
                            <input type="number" id="gridSize" min="8" max="30" value="10">
                        </div>

                        <div class="form-group">
                            <label for="allowDiagonal">Palavras na Diagonal</label>
                            <select id="allowDiagonal">
                                <option value="true">Permitir diagonal</option>
                                <option value="false" selected>Apenas horizontal e vertical</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-header">
                            <label for="wordsList">Lista de Palavras (uma por linha)</label>
                            <button type="button" class="btn-example" id="btnExample">
                                <span>✨</span>
                                <span>Gerar Exemplo</span>
                            </button>
                        </div>
                        <textarea id="wordsInput" placeholder="Digite as palavras aqui, uma por linha:&#10;&#10;CACHORRO&#10;GATO&#10;PASSARO&#10;PEIXE&#10;COELHO" rows="12"></textarea>
                    </div>

                    <div class="alert" id="alert">
                        <p class="alert-text" id="alertText"></p>
                    </div>

                    <div class="button-group">
                        <button class="btn-generate" id="btnGenerate">Gerar Caça-Palavras</button>
                    </div>
                </div>
            </div>

            <button class="btn-print" id="btnPrint"> Imprimir</button>

            <div class="wordsearch-container" id="wordsearchContainer">
                <div class="wordsearch-wrapper">
                    <div class="wordsearch-grid" id="wordsearchGrid"></div>
                    <div class="words-list-section">
                        <h3 class="words-list-title">Encontre as Palavras</h3>
                        <ul class="words-list" id="wordsList"></ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>Feito com <span class="footer-heart">❤️</span> para Teacher Carol © 2025</p>
            </div>
        </div>
    </footer>

    <!-- Modal de Feedback -->
    <div class="feedback-modal" id="feedbackModal">
        <div class="feedback-message" id="feedbackMessage">
            <button class="btn-close-modal" id="btnCloseModal" aria-label="Fechar">×</button>
            <h3 id="feedbackTitle"></h3>
            <p id="feedbackText"></p>
            <button class="btn-new-game" id="btnNewGame" style="display: none;">
                <span>🎲</span>
                <span>Gerar Novo Jogo</span>
            </button>
        </div>
    </div>

    <!-- Dependências JavaScript -->
    <script src="../../libs/jquery.min.js"></script>
    <script src="../../libs/select2.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
