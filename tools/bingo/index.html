<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerador de Cartelas de Bingo - Teacher Carol's Toolkit">
    <meta name="author" content="Caroline Castro">
    
    <title>Gerador de Bingo | Teacher Carol's Toolkit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../libs/select2.min.css">
    
    <link rel="stylesheet" href="../../css/styles.css">
    
    <link rel="stylesheet" href="styles.css">
    
    <link rel="icon" type="image/png" href="../../images/logo.png">
</head>
<body>
    
    <header class="header">
        <div class="header-content">
            <a href="../../index.html" class="logo-container">
                <img src="../../images/logo.png" alt="Teacher Carol's Toolkit Logo" class="logo-img">
                <div class="site-title">
                    <h1>Teacher Carol's Toolkit</h1>
                    <span class="site-subtitle">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="3" y1="15" x2="21" y2="15"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                            <line x1="15" y1="3" x2="15" y2="21"/>
                            <circle cx="6" cy="6" r="0.25" fill="currentColor"/>
                            <circle cx="12" cy="12" r="0.25" fill="currentColor"/>
                            <circle cx="18" cy="18" r="0.25" fill="currentColor"/>
                        </svg>
                        Gerador de Bingo
                    </span>
                </div>
            </a>
            <div class="keyboard-shortcut-hint">
                Atalho: <kbd>Shift</kbd> + <kbd>Enter</kbd>
            </div>
        </div>
    </header>

    <main style="flex: 1; padding: var(--spacing-md) 0;">
        <div class="container">
            <div class="config-panel" id="configPanel">
                <div class="config-header">
                    <h1 class="page-title">Gerador de Cartelas de Bingo</h1>
                    <button class="toggle-config-btn" id="toggleConfigBtn" style="display: none;">
                        <span>▲</span>
                        <span>Recolher</span>
                    </button>
                </div>

                <div class="config-content">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="gridSize">Tamanho da Grade</label>
                            <select id="gridSize">
                                <option value="2">2x2 (4 espaços)</option>
                                <option value="3" selected>3x3 (9 espaços)</option>
                                <option value="4">4x4 (16 espaços)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="numCards">Número de Cartelas</label>
                            <input type="number" id="numCards" min="1" max="100" value="6">
                        </div>

                        <div class="form-group">
                            <label for="roomId">Identificação (até 4 letras)</label>
                            <input type="text" id="roomId" maxlength="4" value="1A" style="text-transform: uppercase;">
                        </div>

                        <div class="form-group">
                            <label for="drawingSpace">Espaço para Desenho</label>
                            <select id="drawingSpace">
                                <option value="true" selected>Com espaço</option>
                                <option value="false">Apenas texto</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-header">
                            <label for="options">Lista de Opções (uma por linha)</label>
                            <button type="button" class="btn-example" id="btnExample">
                                <span>✨</span>
                                <span>Gerar Exemplo</span>
                            </button>
                        </div>
                        <textarea id="options" placeholder="Apple&#10;Banana&#10;Orange&#10;Grape&#10;Watermelon&#10;Strawberry&#10;Pineapple&#10;Mango&#10;Kiwi" rows="12"></textarea>
                    </div>

                    <div class="alert" id="alert">
                        <p class="alert-text" id="alertText"></p>
                    </div>

                    <div class="button-group">
                        <button class="btn-generate" id="btnGenerate">Gerar Cartelas</button>
                    </div>
                </div>
            </div>

            <button class="btn-print" id="btnPrint">🖨️ Imprimir</button>

            <div class="cards-container" id="cardsContainer"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>Feito com <span class="footer-heart">
                    <svg class="footer-heart-icon" width="14" height="14" viewBox="0 0 24 24" fill="#ff6b9d" stroke="none">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </span> para Teacher Carol © 2025</p>
            </div>
        </div>
    </footer>

    <script src="../../libs/jquery.min.js"></script>
    
    <script src="../../libs/select2.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
